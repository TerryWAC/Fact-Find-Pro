# FactFind Pro — local Supabase configuration
# Run `supabase start` to bring up Postgres, Auth, Storage and Studio locally.

project_id = "factfind-pro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Catches every outbound email locally at http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Approval is handled by FactFind Pro itself, so local signups skip the
# confirmation round-trip. Turn this ON in production.
enable_confirmations = false
secure_password_change = true

[auth.email.template.recovery]
subject = "Reset your FactFind Pro password"

[analytics]
enabled = false
